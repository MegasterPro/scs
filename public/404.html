<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Restore the intended URL after redirect
      const redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect);
      }
    </script>
  </head>
  <body>
    <script>
      (function () {
        // SPA base
        const spaBase = '/scs/';
        // full original request (pathname + query + hash)
        const original = location.pathname + location.search + location.hash;
        // if already inside SPA, avoid loop
        if (location.pathname === spaBase || location.pathname.startsWith(spaBase)) {
          return;
        }
        // redirect to SPA with original path in the hash so the SPA router can restore it
        const target = spaBase + '#' + original;
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
