<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <script>
            const redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
            if (redirect && redirect !== location.href) {
                try {
                    const u = new URL(redirect, location.origin);
                    if (!u.pathname.startsWith('/brightcoders')) {
                        history.replaceState(null, null, redirect);
                    }
                } catch (e) {
                    history.replaceState(null, null, redirect);
                }
            }
        </script>
    </head>
    <body>
        <script>
            if (!location.pathname.startsWith('/brightcoders')) {
                sessionStorage.redirect = location.href;
                window.location.replace("/scs/");
            }
            // sinon: laisser la page /brightcoders s'afficher normalement
        </script>
    </body>
</html>
